name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-dev libssl-dev libsqlite3-dev libopus-dev unzip lua5.4

      - name: Scoped sync regressions
        run: |
          lua5.4 test/scoped_assets_test.lua
          lua5.4 test/scoped_item_files_test.lua
          lua5.4 test/item_types_new_test.lua
          lua5.4 test/tests/refresh_cancellation.lua

      - name: Test
        working-directory: test
        run: ./test
